<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カイくん恋愛ゲーム</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Noto+Serif+JP:wght@300;400;600&display=swap');
:root{
  --pink:#e8608a; --pink-l:#f2a0bc; --pink-ll:#fce8f0;
  --pink-d:#c0446e; --pg:linear-gradient(135deg,#e8608a,#f09ab8);
  --gold:#c8a84b; --gold-l:#f0dfa0; --gold-ll:#fdf8e8;
  --green:#3aaa7a; --text:#2a1520; --text-l:#b08098;
  --sh:0 4px 24px rgba(200,80,120,.14); --r:14px;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;overflow:hidden;}
body{font-family:'Noto Sans JP',sans-serif;background:#111;color:var(--text);}

/* ═══ SCREENS ═══ */
.screen{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;}
.screen.hidden{display:none!important;}

/* ═══ TITLE ═══ */
#title-screen{background:linear-gradient(160deg,#fff0f5 0%,#ffe8f2 45%,#f5e0ff 100%);}
.t-bar{position:absolute;top:0;left:0;right:0;height:8px;background:var(--pg);}
.t-petals{position:absolute;inset:0;pointer-events:none;overflow:hidden;}
.petal{position:absolute;font-size:16px;opacity:0;animation:fall var(--d,8s) var(--dl,0s) ease-in infinite;}
@keyframes fall{0%{opacity:0;transform:translateY(-20px) rotate(0)}10%{opacity:.7}90%{opacity:.2}100%{opacity:0;transform:translateY(110vh) rotate(400deg) translateX(30px)}}
.t-icon{font-size:40px;animation:spin 14s linear infinite;margin-bottom:8px;}
@keyframes spin{to{transform:rotate(360deg)}}
.t-logo{font-family:'Noto Serif JP',serif;font-size:clamp(20px,4.5vw,44px);font-weight:300;color:var(--pink-d);letter-spacing:.1em;text-shadow:0 2px 16px rgba(200,80,120,.22);margin-bottom:6px;text-align:center;max-width:90vw;overflow-wrap:break-word;}
.t-sub{font-size:12px;color:var(--text-l);letter-spacing:.28em;margin-bottom:40px;}
.t-btn{width:220px;padding:14px;margin:5px auto;display:block;background:#fff;border:2px solid var(--pink-l);border-radius:40px;color:var(--pink-d);font-family:'Noto Serif JP',serif;font-size:15px;cursor:pointer;letter-spacing:.1em;transition:all .22s;box-shadow:var(--sh);}
.t-btn:hover{background:var(--pg);color:#ffffff;border-color:transparent;transform:translateY(-2px);}

/* ═══ NAME INPUT ═══ */
#name-screen{background:linear-gradient(160deg,#fff0f5,#ffe8f2);}
.n-card{background:#fff;border-radius:22px;padding:36px 32px;width:min(420px,90vw);box-shadow:0 8px 40px rgba(200,80,120,.16);text-align:center;}
.n-card h2{font-family:'Noto Serif JP',serif;font-size:19px;color:var(--pink-d);margin:12px 0 6px;}
.n-card p{font-size:13px;color:var(--text-l);margin-bottom:22px;}
.n-in{width:100%;border:2px solid var(--pink-l);border-radius:12px;padding:12px 14px;font-family:'Noto Serif JP',serif;font-size:18px;text-align:center;color:var(--text);outline:none;transition:border-color .2s;letter-spacing:.12em;}
.n-in:focus{border-color:var(--pink);}
.n-cnt{font-size:11px;color:var(--text-l);text-align:right;margin-top:3px;}
.n-ok{margin-top:16px;width:100%;padding:13px;background:var(--pg);border:none;border-radius:12px;color:#ffffff;font-size:15px;font-weight:500;cursor:pointer;transition:all .2s;}
.n-ok:hover{opacity:.85;}
.n-skip{margin-top:10px;font-size:12px;color:var(--text-l);cursor:pointer;text-decoration:underline;}
.n-skip:hover{color:var(--pink);}

/* ═══ GAME ═══ */
#game-screen{background:#1a1020;align-items:stretch;justify-content:stretch;}

/* BG */
#bg-layer{position:absolute;inset:0;background:linear-gradient(160deg,#d8c8d8,#c0b8cc);background-size:cover;background-position:center;z-index:0;}
#bg-overlay{position:absolute;inset:0;background:rgba(0,0,0,0);z-index:1;transition:background .4s;pointer-events:none;}

/* ── SPRITE – full bust-up (ref image 2 style) ──
   Image fills the entire screen. Textbox overlays on top (z:10 > z:8).
   object-fit:cover + object-position:top center keeps the face filling the frame.
   The lower body is naturally hidden behind the textbox.
*/
#sprite-wrap{
  position:absolute;
  left:0;
  right:0;
  top:0;
  bottom:0;
  height:100%;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  z-index:8;
  pointer-events:none;
  transition:opacity .35s;
  overflow:hidden;
}
#sprite-wrap.hidden{opacity:0;}
#sprite-img{
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:bottom center;
  transform:translateY(12px);
  filter:drop-shadow(0 4px 20px rgba(0,0,0,.22));
  transition:opacity .25s, transform .25s;
  display:block;
}
#sprite-img.fade{opacity:0;}
