<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>管理者ポータル</title>
  <style>
    body{font-family:sans-serif;background:#111;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;margin:0;}
    .card{width:min(420px,92vw);background:#1f1f1f;border:1px solid #444;border-radius:14px;padding:20px;}
    input,button{width:100%;padding:10px;border-radius:8px;border:1px solid #555;margin-top:10px;}
    button{cursor:pointer;background:#e8608a;color:#fff;border:none;}
    .hint{font-size:12px;color:#bbb;margin-top:8px;line-height:1.6;}
  </style>
</head>
<body>
  <div class="card">
    <h2>管理者ポータル</h2>
    <p>このページURLを知っている人だけが設定画面へ進めます。</p>
    <input id="portal-code" type="password" placeholder="ポータルコード">
    <button onclick="enterAdmin()">設定画面へ</button>
    <div class="hint">※ `PORTAL_CODE` と index.html 内の `OWNER_ASSET_CODE` はあなた専用の値に変更してください。</div>
  </div>
  <script>
    const PORTAL_CODE='SET-YOUR-PORTAL-CODE';
    function enterAdmin(){
      const code=document.getElementById('portal-code').value;
      if(code!==PORTAL_CODE){
        alert('コードが違います');
        return;
      }
      sessionStorage.setItem('kai_admin_mode','1');
      location.href='index.html#settings';
    }
  </script>
</body>
</html>
